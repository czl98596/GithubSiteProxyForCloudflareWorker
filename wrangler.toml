name = "gh"
main = "src/index.js"
compatibility_date = "2024-04-06"

# 代理入口：gh.example.com（github.com 主站，与 README 一致）
# 以及 <原生域名>-gh.example.com（例如 raw-githubusercontent-com-gh.example.com）
routes = [
  { pattern = "gh.example.com/*", zone_name = "example.com" },
  { pattern = "*-gh.example.com/*", zone_name = "example.com" }
]


